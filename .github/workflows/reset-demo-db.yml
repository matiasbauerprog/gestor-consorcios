name: Reset Demo Database

on:
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:        # Permite disparar el reset manualmente desde la solapa Actions en GitHub

jobs:
  reset-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          submodules: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar reset y seed de la base demo
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'demo-secret-key-seed-reset-2026' }}
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL || secrets.DATABASE_URL }}
          DEMO_MODE: "true"
          SEED_ENABLED: "false"
          SUPER_ADMIN_EMAIL: ${{ secrets.DEMO_SUPER_ADMIN_EMAIL || secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD || secrets.DEMO_SUPER_ADMIN_PASSWORD }}
          DEMO_SEED_PASSWORD: ${{ secrets.DEMO_SEED_PASSWORD }}
        run: |
          python -m backend.seed_demo --reset
