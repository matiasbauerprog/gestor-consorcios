              schema:
                type: array
                items: { $ref: '#/components/schemas/MovimientoCajaOut' }
    post:
      tags: [Cajas]
      summary: Cargar ajuste manual (admin)
      operationId: crearAjusteCaja
      security: [{bearerAuth: []}]
      parameters:
        - name: caja_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AjusteCrear' }
      responses:
        '201': { description: Ajuste creado, content: { application/json: { schema: { $ref: '#/components/schemas/MovimientoCajaOut' }}}}
        '400': { description: Caja inactiva o descripción muy corta }
        '404': { description: Caja no encontrada }
        '409': { description: Período cerrado }

  /transferencias-caja:
    get:
      tags: [TransferenciasCaja]
      summary: Listar transferencias (admin)
      operationId: listarTransferencias
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferenciaCajaOut' }
    post:
      tags: [TransferenciasCaja]
      summary: Crear transferencia (admin)
      operationId: crearTransferencia
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferenciaCajaCrear' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferenciaCajaOut' }
        '400': { description: Origen=destino, monto<=0, caja inactiva }
        '409': { description: Período cerrado }

  /tesoreria:
    get:
      tags: [Tesoreria]
      summary: Resumen de tesorería (admin)
      operationId: obtenerResumenTesoreria
      security: [{bearerAuth: []}]
      parameters:
        - name: ultimos
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenTesoreriaOut' }
        '401': { description: Token ausente }
        '403': { description: Rol no autorizado }

  /tesoreria/movimientos-pdf:
    get:
      tags: [Tesoreria]
      summary: PDF de movimientos de caja por rango de fechas (admin)
      operationId: pdfMovimientosCaja
      security: [{bearerAuth: []}]
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { description: '`desde` posterior a `hasta`' }
        '401': { description: Token ausente }
        '403': { description: Rol no autorizado }

  # =========================================================================
  # REPORTES
  # =========================================================================

  /reportes/morosos:
    get:
      tags: [Reportes]
      summary: Lista de morosos
      operationId: listarMorosos
      security: [{bearerAuth: []}]
      parameters:
        - name: solo_deudores
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemMorosoOut' }
        '401': { description: Token ausente }

  /reportes/morosos/pdf:
    get:
      tags: [Reportes]
      summary: PDF de lista de morosos
      operationId: pdfMorosos
      security: [{bearerAuth: []}]
      parameters:
        - name: solo_deudores
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /reportes/estado-financiero:
    get:
      tags: [Reportes]
      summary: Estado financiero a una fecha
      operationId: obtenerEstadoFinancieroReporte
      security: [{bearerAuth: []}]
      parameters:
        - name: fecha_corte
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoFinancieroReporteOut' }

  /reportes/estado-financiero/pdf:
    get:
      tags: [Reportes]
      summary: PDF del estado financiero
      operationId: pdfEstadoFinanciero
      security: [{bearerAuth: []}]
      parameters:
        - name: fecha_corte
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /reportes/gastos/{periodo}:
    get:
      tags: [Reportes]
      summary: Detalle de gastos del período
      operationId: obtenerGastosDelPeriodoReporte
      security: [{bearerAuth: []}]
      parameters:
        - name: periodo
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: rubro
          in: query
          schema: { type: string }
        - name: proveedor_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastosDelPeriodoReporteOut' }

  /reportes/gastos/{periodo}/pdf:
    get:
      tags: [Reportes]
      summary: PDF del detalle de gastos del período
      operationId: pdfGastosPeriodo
      security: [{bearerAuth: []}]
      parameters:
        - name: periodo
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: rubro
          in: query
          schema: { type: string }
        - name: proveedor_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /reportes/proveedores:
    get:
      tags: [Reportes]
      summary: Lista de proveedores con totales facturados
      operationId: listarProveedoresReporte
      security: [{bearerAuth: []}]
      parameters:
        - name: anio
          in: query
          schema: { type: integer }
        - name: periodo
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemProveedorOut' }

  /reportes/proveedores/pdf:
    get:
      tags: [Reportes]
      summary: PDF de la lista de proveedores
      operationId: pdfProveedores
      security: [{bearerAuth: []}]
      parameters:
        - name: anio
          in: query
          schema: { type: integer }
        - name: periodo
          in: query
          schema: { type: string }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  # =========================================================================
  # CONSORCIOS (Plan D)
  # =========================================================================

  /consorcios:
    get:
      tags: [Consorcios]
      summary: Listar consorcios de la administración
      description: |
        Devuelve todos los consorcios pertenecientes a la administración del
        usuario admin autenticado. NO requiere `X-Consorcio-Id` (el scope es la
        administración, no un consorcio específico).
      operationId: listarConsorciosDelTenant
      responses:
        '200':
          description: Listado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsorcioOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Consorcios]
      summary: Crear consorcio (wizard 4 pasos) + caja default
      description: |
        Alta de un nuevo consorcio dentro de la administración del usuario admin.
        Body completo del wizard: datos del consorcio, administración, banco y
        vencimientos. El backend crea el consorcio y en la misma transacción una
        Caja "Banco principal" (tipo `banco`) apuntada por
        `caja_default_pagos_id`. No requiere `X-Consorcio-Id`.
      operationId: crearConsorcio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsorcioCrear'
      responses:
        '201':
          description: Consorcio creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsorcioOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          description: CUIT del consorcio ya usado en la misma administración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /consorcios/{consorcio_id}:
    get:
      tags: [Consorcios]
      summary: Obtener consorcio por id
      description: |
        Admin del tenant: puede leer cualquier consorcio de su administración.
        Representante: solo su propio consorcio.
        Departamento: el consorcio de su departamento.
        Reemplaza `GET /configuracion` (deprecated).
      operationId: obtenerConsorcio
      parameters:
        - name: consorcio_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Consorcio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsorcioOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Consorcio no encontrado o no accesible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Consorcios]
      summary: Editar consorcio (reemplaza PUT /configuracion)
      description: |
        Solo el admin de la administración dueña del consorcio puede editar.
        Incluye `usa_personal_propio` (feature flag que oculta el grupo Personal
        en el frontend cuando es false).
      operationId: actualizarConsorcio
      parameters:
        - name: consorcio_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsorcioActualizar'
      responses:
        '200':
          description: Consorcio editado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsorcioOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Consorcio no encontrado o no accesible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # SUPER-ADMIN (Plan B)
  # =========================================================================

  /super-admin/administraciones:
    get:
      tags: [SuperAdmin]
      summary: Listar administraciones (tenants)
      description: |
        Devuelve todas las administraciones registradas en la plataforma,
        ordenadas por razón social. Solo accesible al rol super_admin.
      operationId: superAdminListarAdministraciones
      responses:
        '200':
          description: Listado de administraciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdministracionOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [SuperAdmin]
      summary: Crear administración + primer usuario admin
      description: |
        En una sola transacción crea la Administración, un Usuario con rol
        `administracion` (con `must_change_password=True`), y devuelve el
        detalle. Loguea `crear_admin` en el audit log. CUIT único; email del
        primer admin único a nivel de la tabla `usuarios`.
      operationId: superAdminCrearAdministracion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministracionCrear'
      responses:
        '201':
          description: Administración creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministracionOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          description: CUIT o email del admin ya en uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/administraciones/{administracion_id}:
    get:
      tags: [SuperAdmin]
      summary: Obtener administración por id
      operationId: superAdminObtenerAdministracion
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Detalle de la administración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministracionOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [SuperAdmin]
      summary: Editar administración
      description: |
        Cambia razón social, email de contacto o plan de la administración.
        Loguea `editar_admin` en el audit log con los cambios aplicados.
      operationId: superAdminEditarAdministracion
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministracionActualizar'
      responses:
        '200':
          description: Administración editada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministracionOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/administraciones/{administracion_id}/suspender:
    post:
      tags: [SuperAdmin]
      summary: Toggle activa/suspendida
      description: |
        Alterna el flag `activa` de la administración. Cuando queda inactiva,
        `/auth/login` de sus usuarios devuelve 403 `administracion_suspendida`.
        Loguea `suspender_admin` o `reactivar_admin` según corresponda.
      operationId: superAdminToggleSuspender
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministracionOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/administraciones/{administracion_id}/usuarios:
    get:
      tags: [SuperAdmin]
      summary: Listar usuarios de una administración
      description: |
        Devuelve los usuarios cuyo `administracion_id` coincide con el path.
        Se usa para poblar el modal de "Gestionar usuarios" del super-admin
        (targets de reset-password / impersonate).
      operationId: superAdminListarUsuariosDeAdministracion
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioAdminOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/administraciones/{administracion_id}/reset-password/{user_id}:
    post:
      tags: [SuperAdmin]
      summary: Reset password de un usuario de la administración
      description: |
        Genera una password temporal (token-urlsafe, 12 bytes), la persiste
        hasheada y setea `must_change_password=True` para forzar cambio en el
        próximo login. Devuelve la password temporal UNA sola vez. Loguea
        `reset_password` en audit log sin persistir la password. El usuario
        debe pertenecer a la administración indicada.
      operationId: superAdminResetPassword
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: user_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Password temporal generada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración o usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/administraciones/{administracion_id}/modulos:
    get:
      tags: [SuperAdmin]
      summary: Obtener módulos habilitados de una administración
      description: |
        Devuelve la lista de módulos disponibles en la plataforma y cuáles están
        habilitados para la administración indicada. NULL en la columna
        `modulos_habilitados` equivale a todos habilitados.
      operationId: superAdminGetModulos
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Módulos disponibles y habilitados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulosAdministracionOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [SuperAdmin]
      summary: Reemplazar módulos habilitados de una administración
      description: |
        Reemplaza completamente la lista de módulos habilitados para la
        administración. Todos los valores deben pertenecer al catálogo conocido
        (error 400 si alguno es desconocido). Loguea `editar_modulos` en el
        audit log.
      operationId: superAdminPutModulos
      parameters:
        - name: administracion_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModulosAdministracionIn'
      responses:
        '200':
          description: Módulos actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulosAdministracionOut'
        '400':
          description: Módulo desconocido en la lista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Administración no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/impersonate/start:
    post:
      tags: [SuperAdmin]
      summary: Iniciar sesión de impersonate
      description: |
        Genera un JWT temporal (15 min) con claim `impersonated_by` apuntando al
        super_admin. Requiere `motivo` de al menos 10 caracteres (queda en el
        audit log). No se puede impersonar a otro super_admin. El JWT
        impersonado NO da acceso a rutas `/super-admin/*` (excepto
        `/impersonate/end`) — usa el rol del usuario impersonado.
      operationId: superAdminImpersonateStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonateStartIn'
      responses:
        '200':
          description: JWT temporal generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonateStartOut'
        '400':
          description: |
            Motivo ausente o menor a 10 caracteres, o target es super_admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Usuario a impersonar no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /super-admin/impersonate/end:
    post:
      tags: [SuperAdmin]
      summary: Cerrar sesión de impersonate
      description: |
        Revoca el JWT impersonado agregándolo a la blacklist y loguea
        `impersonate_end` en el audit log. Solo funciona si el token tiene el
        claim `impersonated_by`.
      operationId: superAdminImpersonateEnd
      responses:
        '204':
          description: Impersonate cerrado, JWT revocado.
        '400':
          description: El token actual no es de impersonate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /super-admin/errores:
    get:
      tags: [SuperAdmin]
      summary: Últimos errores inesperados del sistema
      description: |
        Lista los errores no previstos, más nuevos primero. **Sólo super admin**:
        son detalles técnicos del sistema y no se le muestran al administrador
        de un consorcio.

        Se registran únicamente los errores *inesperados*. Los 404, 403 y
        validaciones son parte del funcionamiento normal y no entran acá.

        Se conservan `ERRORES_RETENCION_DIAS` (90 por defecto) y después se
        borran solos.
      operationId: listarErrores
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista de errores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorRegistradoOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /super-admin/errores/{codigo}:
    get:
      tags: [SuperAdmin]
      summary: Buscar un error por su código
      description: |
        El código es lo que ve el usuario cuando algo falla y lo único que viaja
        del vecino al soporte. Se acepta en minúsculas y con espacios de más,
        que es como llega cuando se dicta por teléfono.
      operationId: obtenerError
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string }
          example: E-7K3MQ9
      responses:
        '200':
          description: El error, con su traza completa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRegistradoOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: No hay ningún error con ese código.

  /super-admin/metricas:
    get:
      tags: [SuperAdmin]
      summary: Métricas globales de la plataforma
      description: |
        Agregados sin drill-down por tenant: cantidad de administraciones
        activas/suspendidas, consorcios totales, departamentos totales,
        expensas emitidas del mes en curso (cantidad y monto total) y
        cantidad de sesiones de impersonate en los últimos 30 días.
      operationId: superAdminMetricas
      responses:
        '200':
          description: Métricas agregadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /super-admin/audit-log:
    get:
      tags: [SuperAdmin]
      summary: Listar entradas del audit log
      description: |
        Devuelve el audit log paginado y ordenado por fecha descendente. Cada
        acción del super-admin (crear/editar/suspender admin, reset-password,
        impersonate start/end) y cada mutación durante impersonate queda
        registrada. Sin política de purga.
      operationId: superAdminAuditLog
      parameters:
        - name: accion
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
          description: Filtrar por nombre exacto de acción.
        - name: administracion_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: Filtrar por administración afectada.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Entradas del audit log.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntryOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

# ===========================================================================
# COMPONENTS
# ===========================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Autenticación mediante token JWT en el header Authorization.

  parameters:
    periodoParam:
      name: periodo
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: "2026-05"

    xConsorcioIdHeader:
      name: X-Consorcio-Id
      in: header
      required: true
      description: |
        ID del consorcio activo sobre el que se opera. Requerido en todo endpoint
        operacional (fuera de `/auth/*` y `/me/*`). El backend valida contra el
        JWT que el usuario tenga acceso a ese consorcio; caso contrario devuelve
        403.
      schema:
        type: integer
        minimum: 1
        example: 1

  responses:

    PedidoInvalido:
      description: El pedido es inválido o le faltan campos requeridos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NoAutenticado:
      description: No se proporcionó token de autenticación o es inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    AccesoDenegado:
      description: El rol del usuario no tiene permisos para acceder al recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PayloadGrande:
      description: Archivo demasiado grande.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    ErrorRegistradoOut:
      type: object
      required: [id, codigo, ocurrido_at, ruta, metodo, tipo, mensaje, traza]
      properties:
        id: { type: integer }
        codigo:
          type: string
          description: Lo que ve el usuario cuando algo falla. Sin caracteres ambiguos (0/O, 1/I/L) porque se dicta por teléfono.
          example: E-7K3MQ9
        ocurrido_at: { type: string, format: date-time }
        ruta: { type: string, example: /gastos }
        metodo: { type: string, example: POST }
        tipo: { type: string, example: ValueError }
        mensaje:
          type: string
          description: Texto del error, con contraseñas y tokens tachados (mejor esfuerzo).
        traza:
          type: string
          description: Traza completa. Sólo la ve el super admin; nunca se devuelve al usuario que provocó el error.
        usuario_id: { type: integer, nullable: true }
        rol: { type: string, nullable: true }
        consorcio_id: { type: integer, nullable: true }

    ArchivoUrlOut:
      type: object
      required: [url, expira_en]
      properties:
        url:
          type: string
          description: Ruta firmada, relativa al host de la API. Usable directamente como `src` o `href`.
          example: /archivos/comprobantes/9f3a1c.jpg?exp=1755561600&firma=a1b2c3
        expira_en:
          type: integer
          description: Segundos de vida de la URL desde que se emitió.
          example: 300

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Descripción legible del error.
          examples: ["No tiene permisos para acceder a este recurso."]

    # ---------------------------- Consorcios (Plan D) ---------------------

    ConsorcioOut:
      type: object
      required:
        - id
        - administracion_id
        - nombre
        - usa_personal_propio
        - consorcio_domicilio
        - consorcio_cuit
        - admin_nombre
        - admin_domicilio
        - admin_email
        - admin_telefono
        - admin_cuit
        - admin_rpa
        - admin_situacion_fiscal
        - banco_titular
        - banco_nombre
        - banco_numero_cuenta
        - banco_cbu
        - dia_primer_vencimiento
        - dias_entre_vencimientos
        - recargo_segundo_vencimiento_pct
        - tasa_interes_mensual_pct
        - reportes_visibles_a_depto
        - peticiones_visibles_a_depto
        - fecha_creacion
      properties:
        id: { type: integer }
        administracion_id: { type: integer }
        nombre: { type: string }
        usa_personal_propio:
          type: boolean
          description: Feature flag — si false, el frontend oculta el grupo Personal en el sidebar.
        consorcio_domicilio: { type: string }
        consorcio_cuit: { type: string }
        consorcio_convenio_suterh: { type: string, nullable: true }
        admin_nombre: { type: string }
        admin_domicilio: { type: string }
        admin_email: { type: string }
        admin_telefono: { type: string }
        admin_cuit: { type: string }
        admin_rpa: { type: string }
        admin_situacion_fiscal: { type: string }
        banco_titular: { type: string }
        banco_nombre: { type: string }
        banco_sucursal: { type: string, nullable: true }
        banco_numero_cuenta: { type: string }
        banco_cbu: { type: string }
        banco_alias: { type: string, nullable: true }
        dia_primer_vencimiento: { type: integer, minimum: 1, maximum: 28 }
        dias_entre_vencimientos: { type: integer, minimum: 1, maximum: 30 }
        recargo_segundo_vencimiento_pct: { type: number, format: float }
        tasa_interes_mensual_pct: { type: number, format: float }
        caja_default_pagos_id: { type: integer, nullable: true }
        reportes_visibles_a_depto: { type: boolean }
        peticiones_visibles_a_depto:
          type: boolean
          description: |
            Si es false, un usuario con rol `departamento` solo ve sus propias
            peticiones en `GET /peticiones`. Default true (comportamiento
            historico: todos los deptos ven las peticiones de todos).
        modulos_habilitados:
          type: array
          items:
            type: string
          description: Módulos SaaS habilitados por el super_admin para la administración dueña.
        fecha_creacion: { type: string, format: date-time }

    ConsorcioCrear:
      type: object
      required:
        - nombre
        - consorcio_domicilio
        - consorcio_cuit
        - admin_nombre
        - admin_domicilio
        - admin_email
        - admin_telefono
        - admin_cuit
        - admin_rpa
        - admin_situacion_fiscal
        - banco_titular
        - banco_nombre
        - banco_numero_cuenta
        - banco_cbu
      properties:
        nombre: { type: string, minLength: 1, maxLength: 255 }
        consorcio_domicilio: { type: string, minLength: 1, maxLength: 500 }
        consorcio_cuit: { type: string, minLength: 1, maxLength: 13 }
        consorcio_convenio_suterh: { type: string, maxLength: 50, nullable: true }
        usa_personal_propio: { type: boolean, default: true }
        admin_nombre: { type: string, minLength: 1, maxLength: 255 }
        admin_domicilio: { type: string, minLength: 1, maxLength: 500 }
        admin_email: { type: string, minLength: 3, maxLength: 255 }
        admin_telefono: { type: string, minLength: 1, maxLength: 50 }
        admin_cuit: { type: string, minLength: 1, maxLength: 13 }
        admin_rpa: { type: string, minLength: 1, maxLength: 50 }
        admin_situacion_fiscal: { type: string, minLength: 1, maxLength: 100 }
        banco_titular: { type: string, minLength: 1, maxLength: 255 }
        banco_nombre: { type: string, minLength: 1, maxLength: 100 }
        banco_sucursal: { type: string, maxLength: 50, nullable: true }
        banco_numero_cuenta: { type: string, minLength: 1, maxLength: 50 }
        banco_cbu: { type: string, minLength: 1, maxLength: 22 }
        banco_alias: { type: string, maxLength: 50, nullable: true }
        dia_primer_vencimiento: { type: integer, minimum: 1, maximum: 28, default: 10 }
        dias_entre_vencimientos: { type: integer, minimum: 1, maximum: 30, default: 10 }
        recargo_segundo_vencimiento_pct: { type: number, minimum: 0, maximum: 100, default: 7.0 }
        tasa_interes_mensual_pct: { type: number, minimum: 0, maximum: 100, default: 3.0 }
        reportes_visibles_a_depto: { type: boolean, default: false }
        peticiones_visibles_a_depto: { type: boolean, default: true }

    ConsorcioActualizar:
      type: object
      description: Todos los campos son opcionales — solo se actualizan los enviados.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 255, nullable: true }
        usa_personal_propio: { type: boolean, nullable: true }
        consorcio_domicilio: { type: string, minLength: 1, maxLength: 500, nullable: true }
        consorcio_cuit: { type: string, minLength: 1, maxLength: 13, nullable: true }
        consorcio_convenio_suterh: { type: string, maxLength: 50, nullable: true }
        admin_nombre: { type: string, minLength: 1, maxLength: 255, nullable: true }
        admin_domicilio: { type: string, minLength: 1, maxLength: 500, nullable: true }
        admin_email: { type: string, minLength: 3, maxLength: 255, nullable: true }
        admin_telefono: { type: string, minLength: 1, maxLength: 50, nullable: true }
        admin_cuit: { type: string, minLength: 1, maxLength: 13, nullable: true }
        admin_rpa: { type: string, minLength: 1, maxLength: 50, nullable: true }
        admin_situacion_fiscal: { type: string, minLength: 1, maxLength: 100, nullable: true }
        banco_titular: { type: string, minLength: 1, maxLength: 255, nullable: true }
        banco_nombre: { type: string, minLength: 1, maxLength: 100, nullable: true }
        banco_sucursal: { type: string, maxLength: 50, nullable: true }
        banco_numero_cuenta: { type: string, minLength: 1, maxLength: 50, nullable: true }
        banco_cbu: { type: string, minLength: 1, maxLength: 22, nullable: true }
        banco_alias: { type: string, maxLength: 50, nullable: true }
        dia_primer_vencimiento: { type: integer, minimum: 1, maximum: 28, nullable: true }
        dias_entre_vencimientos: { type: integer, minimum: 1, maximum: 30, nullable: true }
        recargo_segundo_vencimiento_pct: { type: number, minimum: 0, maximum: 100, nullable: true }
        tasa_interes_mensual_pct: { type: number, minimum: 0, maximum: 100, nullable: true }
        caja_default_pagos_id: { type: integer, minimum: 1, nullable: true }
        reportes_visibles_a_depto: { type: boolean, nullable: true }
        peticiones_visibles_a_depto: { type: boolean, nullable: true }

    # ---------------------------- Super-admin (Plan B) --------------------

    AdministracionOut:
      type: object
      required: [id, razon_social, cuit, email_contacto, activa, plan, fecha_creacion]
      properties:
        id: { type: integer, example: 1 }
        razon_social: { type: string, example: "Estudio López" }
        cuit: { type: string, example: "30-12345678-9" }
        email_contacto: { type: string, example: "info@estudio-lopez.com" }
        activa: { type: boolean, example: true }
        plan: { type: string, example: "free" }
        fecha_creacion: { type: string, format: date-time }

    AdministracionCrear:
      type: object
      required: [razon_social, cuit, email_contacto, admin_email, admin_password_inicial]
      properties:
        razon_social: { type: string, minLength: 1, maxLength: 255 }
        cuit: { type: string, minLength: 1, maxLength: 13 }
        email_contacto: { type: string, minLength: 3, maxLength: 255 }
        admin_email:
          type: string
          minLength: 3
          maxLength: 255
          description: Email del primer usuario admin (rol `administracion`).
        admin_password_inicial:
          type: string
          minLength: 8
          maxLength: 128
          description: Password inicial. El usuario deberá cambiarla en el primer login.

    AdministracionActualizar:
      type: object
      properties:
        razon_social: { type: string, minLength: 1, maxLength: 255, nullable: true }
        email_contacto: { type: string, minLength: 3, maxLength: 255, nullable: true }
        plan: { type: string, maxLength: 50, nullable: true }

    ResetPasswordOut:
      type: object
      required: [password_temporal]
      properties:
        password_temporal:
          type: string
          description: Password temporal en claro. Solo se devuelve una vez.

    UsuarioAdminOut:
      type: object
      required: [id, email, rol, must_change_password]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        rol:
          type: string
          enum: [administracion, representante, departamento, super_admin]
        departamento_id: { type: integer, nullable: true }
        consorcio_id: { type: integer, nullable: true }
        must_change_password: { type: boolean }

    ImpersonateStartIn:
      type: object
      required: [usuario_id, motivo]
      properties:
        usuario_id: { type: integer, minimum: 1 }
        motivo:
          type: string
          minLength: 10
          maxLength: 500
          description: Motivo del impersonate (queda en el audit log).

    ImpersonateStartOut:
      type: object
      required: [access_token, token_type, expires_in, impersonated_user_id]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: "bearer" }
        expires_in: { type: integer, example: 900 }
        impersonated_user_id: { type: integer }

    MetricasOut:
      type: object
      required: [administraciones, consorcios, departamentos, expensas_ultimo_mes, impersonates_ultimos_30_dias]
      properties:
        administraciones:
          type: object
          properties:
            activas: { type: integer }
            suspendidas: { type: integer }
            total: { type: integer }
        consorcios:
          type: object
          properties:
            total: { type: integer }
        departamentos:
          type: object
          properties:
            total: { type: integer }
        expensas_ultimo_mes:
          type: object
          properties:
            emitidas: { type: integer }
            monto_total: { type: number, format: float }
        impersonates_ultimos_30_dias: { type: integer }

    AuditLogEntryOut:
      type: object
      required: [id, super_admin_usuario_id, accion, fecha]
      properties:
        id: { type: integer }
        super_admin_usuario_id: { type: integer }
        accion:
          type: string
          description: |
            crear_admin, editar_admin, suspender_admin, reactivar_admin,
            reset_password, impersonate_start, impersonate_end,
            impersonate_mutacion.
        administracion_id_afectada: { type: integer, nullable: true }
        motivo:
          type: string
          nullable: true
          description: Obligatorio para `impersonate_start`.
        detalles:
          type: string
          nullable: true
          description: JSON serializado con contexto; campos sensibles se redactan.
        fecha: { type: string, format: date-time }

    ModulosAdministracionIn:
      type: object
      required: [habilitados]
      properties:
        habilitados:
          type: array
          items: { type: string }
          description: Lista de claves de módulos a habilitar.

    ModulosAdministracionOut:
      type: object
      required: [disponibles, habilitados]
      properties:
        disponibles:
          type: array
          items: { type: string }
          description: Catálogo completo de módulos de la plataforma.
        habilitados:
          type: array
          items: { type: string }
          description: Módulos actualmente habilitados para esta administración.

    # ---------------------------- Auth ------------------------------------

    LoginIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
          examples: ["admin@consorcio.local"]
        password:
          type: string
          minLength: 1
          maxLength: 255
          format: password

    RecuperarPasswordIn:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
          description: Email de la cuenta. La respuesta no revela si existe.
          example: vecino@ejemplo.com

    RestablecerPasswordIn:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: El token que viajó en el link del email. De un solo uso.
        new_password:
          type: string
          minLength: 8
          maxLength: 255
          format: password
          description: Contraseña nueva, mínimo 8 caracteres.

    CambiarPasswordIn:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 255
          format: password
          description: Contraseña actual del usuario (para confirmar identidad).
        new_password:
          type: string
          minLength: 8
          maxLength: 255
          format: password
          description: Nueva contraseña a establecer. Mínimo 8 caracteres.

    TokenOut:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT firmado con HS256.
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          format: int32
          description: Segundos hasta el vencimiento del token.
        user:
          $ref: '#/components/schemas/UsuarioOut'

    UsuarioOut:
      type: object
      required: [id, email, rol, activa, must_change_password]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        rol:
          type: string
          enum: [administracion, representante, departamento]
        departamento_id:
          type: integer
          format: int64
          nullable: true
          description: Solo presente para usuarios con rol `departamento`.
        activa:
          type: boolean
          description: Falso si el usuario fue suspendido — no puede loguearse.
        must_change_password:
          type: boolean
          description: True cuando debe cambiar la contraseña al ingresar.

    UsuarioEstado:
      type: object
      required: [activa]
      properties:
        activa:
          type: boolean

    PadronImportItemOut:
      type: object
      required: [codigo, depto_status, usuario_status]
      properties:
        codigo: { type: string }
        ubicacion: { type: string, nullable: true }
        email: { type: string, nullable: true }
        depto_status:
          type: string
          enum: [creado, reutilizado, error]
        usuario_status:
          type: string
          enum: [creado, sin_usuario, error]
        password_generada:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    PadronImportarResultado:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/PadronImportItemOut'

    # ---------------------------- Expensas --------------------------------

    ExpensaOut:
      type: object
      properties:
        id: { type: integer }
        departamento_id: { type: integer }
        periodo: { type: string }
        monto_primer_vencimiento: { type: number }
        fecha_primer_vencimiento: { type: string, format: date }
        monto_segundo_vencimiento: { type: number }
        fecha_segundo_vencimiento: { type: string, format: date }
        saldo_anterior: { type: number }
        estado_calculado: { type: string }
        monto_pendiente: { type: number }
        monto_exigible:
          type: number
          description: >-
            Lo que hay que pagar por esta expensa sin contar intereses: el
            primer vencimiento más el recargo por mora efectivamente devengado
            (movimiento de tipo `recargo` asentado contra la expensa). No se
            deduce de la fecha: una expensa pagada en término nunca lo incluye.
        interes_acumulado:
          type: number
          description: >-
            Interés punitorio corrido sobre el saldo impago desde el segundo
            vencimiento (o desde la última capitalización), ya incluido en
            `monto_pendiente`. Puede tener centavos.
        detalle:
          type: array
          items: { $ref: '#/components/schemas/LineaDetalleExpensaOut' }

    Expensa:
      $ref: '#/components/schemas/ExpensaOut'

    ExpensaCrear:
      type: object
      required: [departamento_id, periodo, monto_primer_vencimiento, fecha_primer_vencimiento, monto_segundo_vencimiento, fecha_segundo_vencimiento]
      properties:
        departamento_id: { type: integer }
        periodo: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        monto_primer_vencimiento: { type: number, exclusiveMinimum: 0 }
        fecha_primer_vencimiento: { type: string, format: date }
        monto_segundo_vencimiento: { type: number, exclusiveMinimum: 0 }
        fecha_segundo_vencimiento: { type: string, format: date }

    Comprobante:
      type: object
      required: [id, departamento_id, fecha_pago, monto, estado]
      properties:
        id:
          type: integer
          format: int64
        departamento_id:
          type: integer
          format: int64
          description: Departamento al que pertenece el comprobante.
        fecha_pago:
          type: string
          format: date
        monto:
          type: number
          format: double
        archivo_path:
          type: string
          description: |
            Clave de almacenamiento del adjunto (`comprobantes/<uuid>.<ext>`) o `null` si no se adjuntó archivo.
            **No es una URL y no se puede abrir directamente**: sirve sólo para saber si hay adjunto.
            Para mostrarlo hay que pedir una URL firmada a `GET /comprobantes/{comprobante_id}/archivo`.
          nullable: true
        estado:
          type: string
          enum: [pendiente_verificacion, aprobado, rechazado]
        motivo_rechazo:
          type: string
          nullable: true
          description: Motivo que cargo la administracion al rechazar. Null si no se rechazo o si no se escribio ninguno.

    ComprobanteActualizar:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [aprobado, rechazado]
          description: Decisión final sobre el comprobante.
        caja_destino_id: { type: integer, nullable: true }
        motivo_rechazo:
          type: string
          maxLength: 1000
          nullable: true
          description: Motivo del rechazo, visible para el departamento. Se ignora si `estado` es `aprobado`.

    # ---------------------------- Tareas ----------------------------------

    Peticion:
      type: object
      required: [id, departamento_id, titulo, descripcion, estado, fecha_creacion]
      properties:
        id:
          type: integer
          format: int64
        departamento_id:
          type: integer
          format: int64
        titulo:
          type: string
        descripcion:
          type: string
        estado:
          type: string
          enum: [abierta, convertida_en_trabajo, rechazada, cancelada]
        motivo_rechazo:
          type: string
          nullable: true
          description: Motivo que cargo la administracion al rechazar. Null si no se rechazo o si no se escribio ninguno.
        fecha_creacion:
          type: string
          format: date-time

    PeticionCrear:
      type: object
      required: [titulo, descripcion]
      properties:
        titulo:
          type: string
        descripcion:
          type: string

    PeticionActualizar:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [rechazada]
          description: Único estado al que se puede transicionar manualmente.
        motivo_rechazo:
          type: string
          maxLength: 1000
          nullable: true
          description: Motivo del rechazo, visible para el departamento que la creó.

    Trabajo:
      type: object
      required: [id, descripcion, estado, fecha_creacion]
      properties:
        id:
          type: integer
          format: int64
        peticion_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Petición que originó el trabajo. Null si el trabajo se creó desde
            cero (sin petición previa).
        descripcion:
          type: string
        estado:
          type: string
          enum: [en_curso, finalizado, cancelado]
        fecha_creacion:
          type: string
          format: date-time
        presupuesto_aprobado_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Presupuesto elegido para este trabajo. Null mientras no se aprobó
            ninguno.
        gasto_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Gasto que dio de baja el trabajo. Se completa al cargar el gasto
            con `trabajo_id`, que es lo que pasa el trabajo a `finalizado`.

    TrabajoCrear:
      type: object
      required: [descripcion]
      properties:
        peticion_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Petición que origina el trabajo. Si se omite o es null, el trabajo
            se crea "desde cero" sin petición asociada.
        descripcion:
          type: string

    TrabajoActualizar:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [finalizado, cancelado]
          description: Estado terminal al que se cierra el trabajo.

    Presupuesto:
      type: object
      required: [id, trabajo_id, proveedor_id, monto, estado, fecha_presentacion, archivo_path, observaciones]
      properties:
        id:
          type: integer
          format: int64
        trabajo_id:
          type: integer
          format: int64
        proveedor_id:
          type: integer
          format: int64
          description: FK al proveedor que presenta el presupuesto.
        monto:
          type: number
          format: double
        estado:
          type: string
          enum: [presentado, aprobado, rechazado]
        fecha_presentacion:
          type: string
          format: date
        archivo_path:
          type: string
          nullable: true
          description: |
            Path relativo al UPLOAD_DIR donde se guarda el archivo adjunto
            (PDF/JPG/PNG/WebP). Null si el presupuesto se cargó sin archivo.
        observaciones:
          type: string
          nullable: true

    PresupuestoActualizar:
      type: object
      description: |
        PATCH parcial. Todos los campos son opcionales. Solo se permite editar
        presupuestos en estado `presentado`.
      properties:
        proveedor_id:
          type: integer
          minimum: 1
          nullable: true
        monto:
          type: number
          exclusiveMinimum: 0
          nullable: true
        fecha_presentacion:
          type: string
          format: date
          nullable: true
        observaciones:
          type: string
          maxLength: 1000
          nullable: true

    CompletarTrabajoOut:
      type: object
      description: |
        Payload pre-completado que devuelve `POST /trabajos/{trabajo_id}/completar`.
        El frontend lo usa para pre-cargar el formulario de `POST /gastos`.
      required: [proveedor_id, monto, concepto_sugerido, trabajo_id]
      properties:
        proveedor_id:
          type: integer
          format: int64
        monto:
          type: number
          format: double
        concepto_sugerido:
          type: string
        trabajo_id:
          type: integer
          format: int64

    # ------------------------ Trabajos recurrentes ------------------------

    TrabajoRecurrenteOut:
      type: object
      required: [id, nombre, descripcion, periodicidad, proveedor_sugerido_id, monto_estimado, activa]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        descripcion: { type: string }
        periodicidad:
          type: string
          enum: [mensual, trimestral, semestral, anual]
        proveedor_sugerido_id:
          type: integer
          format: int64
          nullable: true
        monto_estimado:
          type: number
          format: double
          nullable: true
        activa: { type: boolean }

    TrabajoRecurrenteCrear:
      type: object
      required: [nombre, descripcion, periodicidad]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 255 }
        descripcion: { type: string, minLength: 1, maxLength: 2000 }
        periodicidad:
          type: string
          enum: [mensual, trimestral, semestral, anual]
        proveedor_sugerido_id:
          type: integer
          minimum: 1
          nullable: true
        monto_estimado:
          type: number
          minimum: 0
          nullable: true
        activa: { type: boolean, default: true }

    TrabajoRecurrenteActualizar:
      type: object
      description: PATCH parcial. Todos los campos son opcionales.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 255, nullable: true }
        descripcion: { type: string, minLength: 1, maxLength: 2000, nullable: true }
        periodicidad:
          type: string
          enum: [mensual, trimestral, semestral, anual]
          nullable: true
        proveedor_sugerido_id: { type: integer, minimum: 1, nullable: true }
        monto_estimado: { type: number, minimum: 0, nullable: true }
        activa: { type: boolean, nullable: true }

    # --------------------------- Notificaciones ---------------------------

    NotificacionOut:
      type: object
      required: [id, usuario_id, tipo, mensaje, link, leida, created_at]
      properties:
        id: { type: integer, format: int64 }
        usuario_id: { type: integer, format: int64 }
        tipo:
          type: string
          description: Código del evento del catálogo que generó la notificación (ej. "peticion_nueva").
        mensaje: { type: string }
        link:
          type: string
          nullable: true
          description: Ruta del frontend a la que navegar al hacer click.
        leida: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificacionesCountOut:
      type: object
      required: [count, otros_consorcios]
      properties:
        count:
          type: integer
          description: Cantidad de notificaciones no leídas del usuario actual en el consorcio activo.
        otros_consorcios:
          type: integer
          description: >-
            No leídas del usuario en los demás consorcios de su administración.
            Siempre 0 para departamento y representante (tienen un solo consorcio).

    PreferenciaNotificacionOut:
      type: object
      required: [tipo, etiqueta, email_activo, editable, motivo_no_editable]
      properties:
        tipo:
          type: string
          description: Código del evento del catálogo (ej. "comunicado_publicado").
        etiqueta:
          type: string
          description: Texto legible del evento para mostrar en la UI.
        email_activo:
          type: boolean
          description: Si este evento le llega por correo al usuario, además de por campanita.
        editable:
          type: boolean
          description: >-
            False si el interruptor se muestra pero no se puede tocar: el
            evento nunca manda mail, o es sólo-mail y apagarlo dejaría al
            usuario sin ningún aviso.
        motivo_no_editable:
          type: string
          nullable: true
          description: Explicación a mostrar junto al interruptor cuando `editable` es false.

    PreferenciaNotificacionIn:
      type: object
      required: [tipo, email_activo]
      properties:
        tipo:
          type: string
          description: Código del evento del catálogo a configurar.
        email_activo:
          type: boolean
          description: Nuevo valor del interruptor de correo para ese evento.

    # ---------------------------- Comunicación ----------------------------

    Comunicado:
      type: object
      required: [id, titulo, cuerpo, fecha_publicacion, autor_id]
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
        cuerpo:
          type: string
        fecha_publicacion:
          type: string
          format: date-time
        autor_id:
          type: integer
          format: int64

    ComunicadoCrear:
      type: object
      required: [titulo, cuerpo]
      properties:
        titulo:
          type: string
        cuerpo:
          type: string

    # ---------------------------- Amenities -------------------------------

    Amenity:
      type: object
      required: [id, nombre, descripcion, activo, precio_reserva, duracion_maxima_horas, anticipacion_maxima_dias, max_reservas_activas_por_depto, horas_minimas_cancelacion]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        activo: { type: boolean }
        precio_reserva: { type: number, nullable: true }
        duracion_maxima_horas: { type: integer, nullable: true }
        anticipacion_maxima_dias: { type: integer, nullable: true }
        max_reservas_activas_por_depto: { type: integer, nullable: true }
        horas_minimas_cancelacion: { type: integer, nullable: true }

    AmenityCrear:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        descripcion: { type: string, maxLength: 500, nullable: true }
        precio_reserva: { type: number, minimum: 0, nullable: true }
        duracion_maxima_horas: { type: integer, exclusiveMinimum: 0, nullable: true }
        anticipacion_maxima_dias: { type: integer, exclusiveMinimum: 0, nullable: true }
        max_reservas_activas_por_depto: { type: integer, exclusiveMinimum: 0, nullable: true }
        horas_minimas_cancelacion: { type: integer, minimum: 0, nullable: true }

    AmenityActualizar:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100, nullable: true }
        descripcion: { type: string, maxLength: 500, nullable: true }
        activo: { type: boolean, nullable: true }
        precio_reserva: { type: number, minimum: 0, nullable: true }
        duracion_maxima_horas: { type: integer, exclusiveMinimum: 0, nullable: true }
        anticipacion_maxima_dias: { type: integer, exclusiveMinimum: 0, nullable: true }
        max_reservas_activas_por_depto: { type: integer, exclusiveMinimum: 0, nullable: true }
        horas_minimas_cancelacion: { type: integer, minimum: 0, nullable: true }

    Departamento:
      type: object
      required: [id, codigo]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
          description: Identificador funcional de la unidad (ej. UF-1A).
          examples: ["UF-1A"]
        descripcion:
          type: string
          nullable: true

    DepartamentoCrear:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 32
          examples: ["UF-3C"]
        descripcion:
          type: string
          maxLength: 255
          nullable: true

    DepartamentoActualizar:
      type: object
      properties:
        descripcion:
          type: string
          maxLength: 255
          nullable: true

    CoeficienteBulkItem:
      type: object
      required: [departamento_id, clase_prorrateo_id, porcentaje]
      properties:
        departamento_id: { type: integer, format: int64 }
        clase_prorrateo_id: { type: integer, format: int64 }
        porcentaje:
          type: number
          minimum: 0
          maximum: 100

    CoeficientesBulkIn:
      type: object
      required: [coeficientes]
      properties:
        coeficientes:
          type: array
          items:
            $ref: '#/components/schemas/CoeficienteBulkItem'

    UsuarioCrear:
      type: object
      required: [email, password, rol]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 255
          format: password
        rol:
          type: string
          enum: [administracion, representante, departamento]
        departamento_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Requerido si `rol == departamento`. Prohibido para los demás roles.

    UsuarioActualizar:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
        rol:
          type: string
          enum: [administracion, representante, departamento]
        departamento_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    Disponibilidad:
      type: object
      required: [amenity_id, bloques]
      properties:
        amenity_id:
          type: integer
          format: int64
        bloques:
          type: array
          items:
            $ref: '#/components/schemas/BloqueHorario'

    BloqueHorario:
      type: object
      required: [inicio, fin, disponible]
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        disponible:
          type: boolean

    Reserva:
      type: object
      required: [id, amenity_id, usuario_id, inicio, fin, estado, movimiento_cuenta_id]
      properties:
        id: { type: integer, format: int64 }
        amenity_id: { type: integer, format: int64 }
        usuario_id: { type: integer, format: int64 }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        estado: { type: string, enum: [confirmada, cancelada] }
        movimiento_cuenta_id: { type: integer, format: int64, nullable: true }

    ReservaCrear:
      type: object
      required: [inicio, fin]
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time

    ClaseProrrateoCrear:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string, minLength: 1, maxLength: 8 }
        nombre: { type: string, minLength: 1, maxLength: 120 }
        descripcion: { type: string, maxLength: 500, nullable: true }

    ClaseProrrateoActualizar:
      type: object
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120, nullable: true }
        descripcion: { type: string, maxLength: 500, nullable: true }
        activa: { type: boolean, nullable: true }

    ClaseProrrateoOut:
      type: object
      required: [id, codigo, nombre, activa]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        activa: { type: boolean }

    ProveedorCrear:
      type: object
      required: [razon_social, cuit]
      properties:
        razon_social: { type: string, minLength: 1, maxLength: 255 }
        nombre_fantasia: { type: string, maxLength: 255, nullable: true }
        cuit: { type: string, pattern: '^\d{2}-\d{8}-\d{1}$' }
        direccion: { type: string, maxLength: 500, nullable: true }

    ProveedorActualizar:
      type: object
      properties:
        razon_social: { type: string, minLength: 1, maxLength: 255, nullable: true }
        nombre_fantasia: { type: string, maxLength: 255, nullable: true }
        direccion: { type: string, maxLength: 500, nullable: true }
        activo: { type: boolean, nullable: true }

    ProveedorOut:
      type: object
      required: [id, razon_social, cuit, activo]
      properties:
        id: { type: integer }
        razon_social: { type: string }
        nombre_fantasia: { type: string, nullable: true }
        cuit: { type: string }
        direccion: { type: string, nullable: true }
        activo: { type: boolean }

    ValidacionOut:
      type: object
      properties:
        tipo: { type: string, enum: [bloqueante, warning] }
        codigo: { type: string }
        mensaje: { type: string }
      required: [tipo, codigo, mensaje]

    LineaDetalleExpensaOut:
      type: object
      properties:
        rubro: { type: string }
        clase_prorrateo_id: { type: integer, nullable: true }
        departamento_origen_id: { type: integer, nullable: true }
        concepto: { type: string }
        monto: { type: number }

    ExpensaACrearOut:
      type: object
      properties:
        departamento_id: { type: integer }
        saldo_anterior: { type: number }
        monto_primer_vencimiento: { type: number }
        monto_segundo_vencimiento: { type: number }
        detalle:
          type: array
          items: { $ref: '#/components/schemas/LineaDetalleExpensaOut' }

    InteresACrearOut:
      type: object
      properties:
        departamento_id: { type: integer }
        monto: { type: number }
        descripcion: { type: string }

    PreviewCierreOut:
      type: object
      properties:
        periodo: { type: string }
        cerrado: { type: boolean }
        fecha_primer_vencimiento: { type: string, format: date }
        fecha_segundo_vencimiento: { type: string, format: date }
        validaciones:
          type: array
          items: { $ref: '#/components/schemas/ValidacionOut' }
        puede_cerrar: { type: boolean }
        expensas:
          type: array
          items: { $ref: '#/components/schemas/ExpensaACrearOut' }
        intereses:
          type: array
          items: { $ref: '#/components/schemas/InteresACrearOut' }
        total_expensado: { type: number }
        total_intereses: { type: number }

    EstadoCierreOut:
      type: object
      properties:
        periodo: { type: string }
        cerrado: { type: boolean }
        validaciones:
          type: array
          items: { $ref: '#/components/schemas/ValidacionOut' }
        puede_cerrar: { type: boolean }

    CerrarPeriodoIn:
      type: object
      properties:
        fecha_primer_vencimiento: { type: string, format: date, nullable: true }
        fecha_segundo_vencimiento: { type: string, format: date, nullable: true }

    PeriodoCerradoOut:
      type: object
      properties:
        periodo: { type: string }
        fecha_cierre: { type: string, format: date-time }
        cerrado_por_usuario_id: { type: integer }
        total_expensado: { type: number }
        total_intereses: { type: number }
        cantidad_expensas: { type: integer }

    ConfiguracionConsorcioOut:
      type: object
      required:
        - id
        - consorcio_nombre
        - consorcio_domicilio
        - consorcio_cuit
        - admin_nombre
        - admin_domicilio
        - admin_email
        - admin_telefono
        - admin_cuit
        - admin_rpa
        - admin_situacion_fiscal
        - banco_titular
        - banco_nombre
        - banco_numero_cuenta
        - banco_cbu
        - dia_primer_vencimiento
        - dias_entre_vencimientos
        - recargo_segundo_vencimiento_pct
        - tasa_interes_mensual_pct
      properties:
        id: { type: integer }
        consorcio_nombre: { type: string }
        consorcio_domicilio: { type: string }
        consorcio_cuit: { type: string }
        consorcio_convenio_suterh: { type: string, nullable: true }
        admin_nombre: { type: string }
        admin_domicilio: { type: string }
        admin_email: { type: string }
        admin_telefono: { type: string }
        admin_cuit: { type: string }
        admin_rpa: { type: string }
        admin_situacion_fiscal: { type: string }
        banco_titular: { type: string }
        banco_nombre: { type: string }
        banco_sucursal: { type: string, nullable: true }
        banco_numero_cuenta: { type: string }
        banco_cbu: { type: string, minLength: 22, maxLength: 22 }
        banco_alias: { type: string, nullable: true }
        dia_primer_vencimiento: { type: integer, minimum: 1, maximum: 28 }
        dias_entre_vencimientos: { type: integer, minimum: 1 }
        recargo_segundo_vencimiento_pct: { type: number, minimum: 0 }
        tasa_interes_mensual_pct: { type: number, minimum: 0 }
        caja_default_pagos_id: { type: integer, nullable: true }
        reportes_visibles_a_depto: { type: boolean }
        peticiones_visibles_a_depto: { type: boolean }

    ConfiguracionConsorcioActualizar:
      type: object
      required:
        - dia_primer_vencimiento
        - dias_entre_vencimientos
        - recargo_segundo_vencimiento_pct
        - tasa_interes_mensual_pct
      properties:
        consorcio_nombre: { type: string, nullable: true }
        consorcio_domicilio: { type: string, nullable: true }
        consorcio_cuit: { type: string, nullable: true }
        consorcio_convenio_suterh: { type: string, nullable: true }
        admin_nombre: { type: string, nullable: true }
        admin_domicilio: { type: string, nullable: true }
        admin_email: { type: string, nullable: true }
        admin_telefono: { type: string, nullable: true }
        admin_cuit: { type: string, nullable: true }
        admin_rpa: { type: string, nullable: true }
        admin_situacion_fiscal: { type: string, nullable: true }
        banco_titular: { type: string, nullable: true }
        banco_nombre: { type: string, nullable: true }
        banco_sucursal: { type: string, nullable: true }
        banco_numero_cuenta: { type: string, nullable: true }
        banco_cbu: { type: string, minLength: 22, maxLength: 22, nullable: true }
        banco_alias: { type: string, nullable: true }
        dia_primer_vencimiento: { type: integer, minimum: 1, maximum: 28 }
        dias_entre_vencimientos: { type: integer, minimum: 1 }
        recargo_segundo_vencimiento_pct: { type: number, minimum: 0 }
        tasa_interes_mensual_pct: { type: number, minimum: 0 }
        caja_default_pagos_id: { type: integer, nullable: true }
        reportes_visibles_a_depto: { type: boolean, default: false }
        peticiones_visibles_a_depto: { type: boolean, default: true }

    CoeficienteItem:
      type: object
      required: [clase_prorrateo_id, porcentaje]
      properties:
        clase_prorrateo_id: { type: integer, minimum: 1 }
