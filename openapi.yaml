openapi: 3.1.0
info:
  title: Sistema Integral de Gestión de Consorcios
  description: |
    API REST para la gestión integral de consorcios. Permite administrar expensas,
    gastos del consorcio, personal y liquidaciones, tareas y presupuestos,
    comunicación interna, reserva de amenities y configuración global. El acceso a
    los recursos está restringido por roles: Administración, Departamentos
    (Inquilinos/Propietarios), Representantes y Super-Admin.
    Fase 3.5 (jun-2026): cuenta corriente por departamento — pagos se asignan FIFO desde movimientos.

    **Multitenant SaaS (Fase 7A, jul-2026)**: la plataforma es multi-tenant con
    jerarquía Super-Admin → Administración → Consorcio → Departamento. Todo
    endpoint operacional (fuera de `/auth/*` y `/me/*`) exige el header
    `X-Consorcio-Id: <id>` para resolver el consorcio activo. El backend valida
    que el usuario del JWT tenga acceso al consorcio pedido; caso contrario
    devuelve **403**. Códigos específicos: `403 cambio_password_requerido`
    (usuario con `must_change_password=True`), `403 administracion_suspendida`
    (login sobre administración inactiva), `403 sin acceso a este consorcio`
    (spoof cross-tenant), `400 X-Consorcio-Id requerido/invalido`.
  version: 1.1.0

servers:
  - url: http://localhost:8000
    description: Servidor local de desarrollo

tags:
  - name: Salud
    description: Healthchecks públicos, sin token
  - name: Auth
    description: Autenticación e intercambio de credenciales por token JWT
  - name: Archivos
    description: Descarga de archivos subidos (comprobantes, adjuntos)
  - name: Expensas
    description: Gestión de expensas y comprobantes de pago
  - name: Tareas
    description: Peticiones de departamentos, trabajos y presupuestos
  - name: Comunicación
    description: Comunicados del consorcio
  - name: Amenities
    description: Disponibilidad y reservas de espacios comunes
  - name: Administracion
    description: Alta y edición de departamentos, usuarios y amenities (solo Administración)
  - name: Gastos
    description: Gastos del consorcio y plantillas recurrentes
  - name: Configuración
    description: Datos del consorcio, clases de prorrateo, proveedores y coeficientes por departamento
  - name: Personal
    description: Empleados, haberes, conceptos de liquidación y liquidaciones mensuales
  - name: Movimientos
    description: Cuenta corriente por departamento. Movimientos (débitos/créditos), notas y saldo.
  - name: Periodos
    description: Cierre de período y liquidación
  - name: Cajas
    description: Cuentas financieras del consorcio
  - name: TransferenciasCaja
    description: Transferencias entre cajas
  - name: Tesoreria
    description: Resumen de tesorería (saldos de cajas y últimos movimientos)
  - name: Reportes
    description: Reportes consultables (morosos, estado financiero, gastos, proveedores)
  - name: Presupuestos
    description: Presupuestos de proveedores para trabajos
  - name: TrabajosRecurrentes
    description: Plantillas de trabajos recurrentes (materialización manual)
  - name: Notificaciones
    description: Sistema de notificaciones in-app (campanita)
  - name: Cuenta
    description: Endpoints del usuario autenticado — listar consorcios accesibles (multitenant)
  - name: SuperAdmin
    description: Endpoints del rol super_admin — CRUD de tenants, reset-password, impersonate con audit log, métricas globales
  - name: Consorcios
    description: CRUD de consorcios de la administración (Plan D). Reemplaza gradualmente al singleton /configuracion

security:
  - bearerAuth: []

paths:

  # =========================================================================
  # 0. SALUD
  # =========================================================================

  /:
    get:
      tags: [Salud]
      summary: Raíz de la API — healthcheck público
      operationId: root
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }

  /health:
    get:
      tags: [Salud]
      summary: Chequeo de vida del servicio
      description: >
        Endpoint público y liviano, sin acceso a base de datos. Existe para que
        un monitor externo pueda pingearlo con frecuencia sin costo: en hostings
        que duermen los servicios por inactividad, ese ping es lo que mantiene
        el demo despierto, y de paso avisa cuando el servicio se cae.
      responses:
        '200':
          description: El servicio está vivo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
    head:
      tags: [Salud]
      summary: Chequeo de vida del servicio (sin cuerpo)
      description: >
        Mismo chequeo que el GET, sin cuerpo de respuesta. Se declara explícito
        porque los planes gratuitos de varios monitores de uptime solo mandan
        HEAD, y FastAPI —a diferencia de Starlette pelado— no agrega HEAD
        automáticamente a las rutas GET: sin esto devolvería 405 y el monitor
        lo reportaría como caída.
      responses:
        '200':
          description: El servicio está vivo

  # =========================================================================
  # 0. AUTH
  # =========================================================================

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener los datos del usuario autenticado
      description: |
        Devuelve los datos del usuario asociado al token JWT presentado. Útil para
        que el frontend recupere el perfil tras un refresh sin necesidad de volver
        a loguear. La identidad se obtiene exclusivamente del token.
      operationId: obtenerUsuarioActual
      responses:
        '200':
          description: Datos del usuario actual recuperados exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El usuario asociado al token ya no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar el token actual (logout)
      description: |
        Marca el `jti` del JWT presentado como revocado hasta su vencimiento
        natural. Tras un logout exitoso, cualquier intento de usar el mismo
        token devuelve 401 con `detail: "Token revocado."`. La blacklist es
        in-memory y se pierde al reiniciar el servidor (los tokens revocados
        vuelven a ser válidos hasta su `exp` original).
      operationId: logout
      responses:
        '204':
          description: Token revocado exitosamente. Sin cuerpo de respuesta.
        '401':
          description: Token ausente, inválido, expirado o ya revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/recuperar-password:
    post:
      tags: [Auth]
      summary: Pedir un link para restablecer la contraseña
      description: |
        Endpoint **público**. Manda por email un link de un solo uso para elegir
        una contraseña nueva.

        **Responde 202 siempre**, exista o no la cuenta, y con el mismo cuerpo.
        Es deliberado: cualquier respuesta distinta —otro código, otro mensaje, o
        un error cuando falla el envío del correo— convertiría este formulario en
        un verificador de qué emails están registrados en el sistema.

        Tampoco emite link para usuarios dados de baja ni de administraciones
        suspendidas, ni supera `RECUPERACION_MAX_POR_HORA` pedidos por usuario y
        por hora. En ninguno de esos casos cambia la respuesta.
      operationId: recuperarPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarPasswordIn'
      responses:
        '202':
          description: Pedido recibido. No indica si el email existe.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Si el email está registrado, te va a llegar un mensaje.
        '400':
          $ref: '#/components/responses/PedidoInvalido'

  /auth/restablecer-password:
    post:
      tags: [Auth]
      summary: Restablecer la contraseña con el token del email
      description: |
        Endpoint **público**. Canjea el token que llegó por email por una
        contraseña nueva.

        El token es de **un solo uso** y vence a los `RECUPERACION_TOKEN_MINUTOS`
        minutos. Pedir un link nuevo invalida los anteriores. Al restablecer se
        baja `must_change_password`, para que el usuario pueda operar de una.

        No cierra las sesiones que ya estaban abiertas con la contraseña vieja.
      operationId: restablecerPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerPasswordIn'
      responses:
        '204':
          description: Contraseña actualizada.
        '400':
          description: El token es inválido, ya se usó o venció; o la contraseña nueva no cumple el mínimo.

  /auth/cambiar-password:
    post:
      tags: [Auth]
      summary: Cambiar la contraseña del usuario autenticado
      description: |
        Permite al usuario autenticado cambiar su propia contraseña. Requiere
        confirmar la contraseña actual: si no coincide se devuelve 401 sin
        modificar nada. El identificador del usuario se obtiene exclusivamente
        del token (nunca del body). En éxito no se devuelve cuerpo (204) y el
        token actual sigue siendo válido — esto NO cierra la sesión.
      operationId: cambiarPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordIn'
      responses:
        '204':
          description: Contraseña actualizada exitosamente. Sin cuerpo de respuesta.
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          description: Token ausente/inválido, o la contraseña actual es incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El usuario asociado al token ya no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/consorcios:
    get:
      tags: [Cuenta]
      summary: Listar consorcios accesibles al usuario autenticado
      description: |
        Devuelve la lista de consorcios sobre los que el usuario del JWT tiene
        acceso operativo. El frontend usa este endpoint tras el login para
        armar el selector de consorcio en el topbar:
        - **administracion**: todos los consorcios de su `administracion_id`.
        - **representante**: sólo su `consorcio_id`.
        - **departamento**: el consorcio de su departamento.
        - **super_admin**: lista vacía (opera fuera con impersonate — Plan B).

        Este endpoint NO requiere `X-Consorcio-Id` (justamente sirve para
        conocer los ids elegibles).
      operationId: listarConsorciosAccesibles
      responses:
        '200':
          description: Consorcios accesibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nombre]
                  properties:
                    id:
                      type: integer
                      example: 1
                    nombre:
                      type: string
                      example: "Consorcio Belgrano"
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuario y obtener token JWT
      description: |
        Intercambia un par (email, password) por un token JWT de tipo Bearer.
        El token devuelto debe enviarse en el header `Authorization: Bearer <token>`
        en las llamadas subsiguientes a endpoints protegidos. El endpoint es
        público (no requiere autenticación previa). En caso de credenciales
        inválidas se devuelve 401 con un mensaje genérico para prevenir
        enumeración de usuarios.
      operationId: login
      security: []  # endpoint público: sin Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Login rechazado por estado del tenant: la administración a la que
            pertenece el usuario está inactiva (`administracion_suspendida`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/demo-login:
    post:
      tags: [Auth]
      summary: Emitir token de un usuario demo sin credenciales
      description: >
        Solo existe cuando el servidor corre con DEMO_MODE=true. En producción
        la ruta no está registrada y devuelve 404. Acepta únicamente uno de tres
        roles de una lista blanca cerrada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol:
                  type: string
                  enum: [administracion, propietario_al_dia, propietario_moroso]
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '400':
          description: Rol fuera de la lista blanca
        '403':
          description: |
            Mismos gates que `/auth/login`: el usuario demo está suspendido
            (`usuario_suspendido`) o su administración está inactiva
            (`administracion_suspendida`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >
            El dataset demo todavía no fue generado, o el usuario demo existe
            pero no tiene el rol esperado para ese selector (mismo mensaje
            para no diferenciar los dos casos).

  # =========================================================================
  # 1. EXPENSAS
  # =========================================================================

  /expensas:
    get:
      tags: [Expensas]
      summary: Listar expensas
      description: |
        Devuelve el historial de expensas. Administración ve todas las expensas
        del consorcio (historial general); los Departamentos ven únicamente las
        asociadas a su propia unidad (aislamiento server-side por el
        `departamento_id` del token). Soporta filtros opcionales por período y
        estado, y paginación mediante `limit` / `offset`.
      operationId: listarExpensas
      parameters:
        - name: periodo
          in: query
          required: false
          description: Filtrar por período (formato YYYY-MM).
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            examples: ["2026-05"]
        - name: departamento_id
          in: query
          required: false
          description: |
            Filtrar por departamento. Sólo efectivo para Administración;
            los usuarios Departamento siempre ven solo sus propias expensas.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de resultados a devolver.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Cantidad de resultados a saltar (paginación).
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista de expensas recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expensa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Expensas]
      summary: Crear una nueva expensa
      description: |
        Crea una expensa para un período determinado. Solo accesible para
        Administración. Una expensa es única por la combinación
        `(departamento_id, periodo)` — si ya existe se devuelve 409.
      operationId: crearExpensa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensaCrear'
      responses:
        '201':
          description: Expensa creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expensa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: El departamento indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una expensa para ese departamento y período.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expensas/{expensa_id}:
    get:
      tags: [Expensas]
      summary: Obtener detalle de una expensa
      description: |
        Devuelve el detalle de una expensa puntual. Los Departamentos solo pueden
        consultar expensas asociadas a su propia unidad.
      operationId: obtenerExpensa
      parameters:
        - name: expensa_id
          in: path
          required: true
          description: Identificador único de la expensa.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle de la expensa recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expensa'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    delete:
      tags: [Expensas]
      summary: Eliminar una expensa (admin, sin pagos aplicados)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: expensa_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Expensa eliminada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Conflicto. La expensa tiene pago FIFO aplicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expensas/{expensa_id}/pdf:
    get:
      tags: [Expensas]
      summary: Descargar PDF de la boleta
      operationId: descargarPdfExpensa
      security:
        - bearerAuth: []
      parameters:
        - name: expensa_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: PDF de la boleta
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /comprobantes:
    get:
      tags: [Expensas]
      summary: Listar comprobantes
      description: |
        Devuelve comprobantes. Administración ve todos los del consorcio;
        Departamento ve sólo los de sus propias expensas (filtrado server-side).
        Representante no tiene acceso.
      operationId: listarComprobantes
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado del comprobante.
          schema:
            type: string
            enum: [pendiente_verificacion, aprobado, rechazado]
        - name: departamento_id
          in: query
          required: false
          description: Filtrar por departamento (Admin). Ignorado para Departamento.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de resultados a devolver.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Cantidad de resultados a saltar (paginación).
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista de comprobantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comprobante'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Expensas]
      summary: Presentar comprobante de pago (depto)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fecha_pago, monto]
              properties:
                fecha_pago: { type: string, format: date }
                monto: { type: number, format: float, exclusiveMinimum: 0 }
                archivo:
                  type: string
                  format: binary
                  description: Imagen JPG/PNG/WebP o PDF, máx 5 MB.
      responses:
        '201':
          description: Comprobante creado en estado `pendiente_verificacion`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comprobante' }
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '413':
          $ref: '#/components/responses/PayloadGrande'

  /comprobantes/{comprobante_id}/archivo:
    get:
      tags: [Expensas]
      summary: Obtener la URL firmada del comprobante
      description: |
        Devuelve una URL de vida corta con la que se puede mostrar o descargar el
        comprobante. Se entrega por separado del recurso porque `<img src>` y
        `<a href>` no mandan el header `Authorization`: la autorización se
        verifica en esta llamada y la URL resultante ya sirve sin token.

        Un departamento sólo obtiene la URL de sus propios comprobantes; pedir la
        de otro devuelve **404** (no 403, para no confirmar que ese comprobante
        existe). Administración accede a los de su consorcio.
      operationId: urlDelComprobante
      parameters:
        - $ref: '#/components/parameters/xConsorcioIdHeader'
        - name: comprobante_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: URL firmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivoUrlOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: No existe, no tiene adjunto, o no le corresponde al usuario.

  /comprobantes/{comprobante_id}:
    patch:
      tags: [Expensas]
      summary: Aprobar o rechazar un comprobante
      description: |
        Permite a Administración decidir sobre un comprobante en estado
        `pendiente_verificacion`. Si se aprueba, la expensa asociada se marca
        automáticamente como `pagada`. Si se rechaza, la expensa queda en su
        estado actual. Estados terminales (aprobado/rechazado) son inmutables.
      operationId: actualizarComprobante
      parameters:
        - name: comprobante_id
          in: path
          required: true
          description: Identificador único del comprobante.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComprobanteActualizar'
      responses:
        '200':
          description: Comprobante actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comprobante'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El comprobante ya fue verificado y no puede modificarse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Expensas]
      summary: Eliminar un comprobante
      description: |
        Soft-delete: el comprobante queda oculto de las vistas pero no se borra
        de la base. Administración puede eliminar cualquiera; un Departamento,
        sólo los propios.
      operationId: eliminarComprobante
      security: [{bearerAuth: []}]
      parameters:
        - name: comprobante_id
          in: path
          required: true
          description: Identificador único del comprobante.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Comprobante eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # =========================================================================
  # 2. TAREAS PARA HACER
  # =========================================================================

  /peticiones:
    get:
      tags: [Tareas]
      summary: Listar peticiones
      description: |
        Lista general de peticiones. Los Departamentos solo ven sus propias
        peticiones; Administración y Representantes ven todas.
      operationId: listarPeticiones
      responses:
        '200':
          description: Lista de peticiones recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peticion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Tareas]
      summary: Crear una petición
      description: |
        Permite a un Departamento registrar una nueva petición (ej. reparación
        en espacio común).
      operationId: crearPeticion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionCrear'
      responses:
        '201':
          description: Petición creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peticion'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /peticiones/{peticion_id}:
    get:
      tags: [Tareas]
      summary: Obtener detalle de una petición
      description: |
        Devuelve el detalle y el estado actual de una petición. Los Departamentos
        solo pueden consultar peticiones que ellos mismos hayan creado.
      operationId: obtenerPeticion
      parameters:
        - name: peticion_id
          in: path
          required: true
          description: Identificador único de la petición.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle de la petición recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peticion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    patch:
      tags: [Tareas]
      summary: Rechazar una petición
      description: |
        Permite a Administración/Representantes rechazar una petición que está
        en estado `abierta`. La aceptación se materializa creando un trabajo vía
        `POST /trabajos`, que también transiciona la petición a
        `convertida_en_trabajo` — por eso este endpoint solo cubre la rama de
        rechazo. Una petición ya rechazada o convertida en trabajo devuelve 409.
      operationId: actualizarPeticion
      parameters:
        - name: peticion_id
          in: path
          required: true
          description: Identificador único de la petición.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeticionActualizar'
      responses:
        '200':
          description: Petición actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peticion'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Transición de estado no permitida desde el estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Tareas]
      summary: Eliminar una petición
      description: |
        Elimina una petición. Administración y Representantes pueden borrar
        cualquier petición en cualquier estado. Los Departamentos solo pueden
        eliminar sus propias peticiones en estado `abierta`; intentar borrar una
        petición ajena o en estado terminal devuelve 403 o 409 respectivamente.
      operationId: eliminarPeticion
      parameters:
        - name: peticion_id
          in: path
          required: true
          description: Identificador único de la petición.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Petición eliminada exitosamente. Sin cuerpo de respuesta.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La petición no está en estado abierta (solo para rol Departamento).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trabajos:
    get:
      tags: [Tareas]
      summary: Listar trabajos
      description: |
        Devuelve todos los trabajos ordenados por fecha de creación descendente.
        Solo accesible para Administración y Representantes. Los Departamentos
        no tienen acceso a la lista global de trabajos.
      operationId: listarTrabajos
      responses:
        '200':
          description: Lista de trabajos recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Tareas]
      summary: Crear un trabajo a realizar
      description: |
        Crea un trabajo. Si se incluye `peticion_id`, el trabajo queda asociado
        a esa petición y la transiciona a `convertida_en_trabajo`. Si se omite,
        el trabajo se crea sin petición previa. Solo accesible para
        Administración y Representantes.
      operationId: crearTrabajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrabajoCrear'
      responses:
        '201':
          description: Trabajo creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /trabajos/{trabajo_id}:
    get:
      tags: [Tareas]
      summary: Obtener detalle de un trabajo
      description: |
        Devuelve el detalle de un trabajo específico por su ID.
        Solo accesible para Administración y Representantes.
      operationId: obtenerTrabajo
      parameters:
        - name: trabajo_id
          in: path
          required: true
          description: Identificador único del trabajo.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalle del trabajo recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    patch:
      tags: [Tareas]
      summary: Cerrar un trabajo (finalizar o cancelar)
      description: |
        Permite a Administración/Representantes cerrar un trabajo en estado
        `en_curso`. Transiciones válidas: `en_curso → finalizado` y
        `en_curso → cancelado`. Los estados `finalizado` y `cancelado` son
        terminales — intentar modificarlos devuelve 409.
      operationId: actualizarTrabajo
      parameters:
        - name: trabajo_id
          in: path
          required: true
          description: Identificador único del trabajo.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrabajoActualizar'
      responses:
        '200':
          description: Trabajo actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Transición de estado no permitida desde el estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trabajos/{trabajo_id}/presupuestos:
    get:
      tags: [Presupuestos]
      summary: Listar presupuestos de un trabajo
      description: |
        Devuelve todos los presupuestos asociados al trabajo, ordenados por
        fecha de presentación. Accesible para todos los roles autenticados
        (admin, representante y departamento) — los departamentos pueden ver
        los presupuestos de trabajos que vienen de sus peticiones.
      operationId: listarPresupuestos
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Lista de presupuestos del trabajo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Presupuesto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    post:
      tags: [Presupuestos]
      summary: Registrar un presupuesto (con archivo adjunto opcional)
      description: |
        Crea un presupuesto para el trabajo. Recibe `multipart/form-data` para
        permitir adjuntar un archivo (PDF/JPG/PNG/WebP ≤ 5MB) junto a los datos.
        El presupuesto se crea en estado `presentado` (la aprobación se hace por
        separado vía POST `/aprobar`). Solo Administración y Representantes.
      operationId: crearPresupuesto
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proveedor_id, monto]
              properties:
                proveedor_id: { type: integer, minimum: 1 }
                monto: { type: number, exclusiveMinimum: 0 }
                fecha_presentacion:
                  type: string
                  format: date
                  description: Opcional. Si se omite, se usa la fecha actual.
                observaciones: { type: string, maxLength: 1000 }
                archivo:
                  type: string
                  format: binary
                  description: PDF/JPG/PNG/WebP, máximo 5 MB.
      responses:
        '201':
          description: Presupuesto registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presupuesto'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /trabajos/{trabajo_id}/presupuestos/{presupuesto_id}:
    patch:
      tags: [Presupuestos]
      summary: Editar un presupuesto presentado
      description: |
        PATCH parcial. Solo se permite editar presupuestos en estado
        `presentado`; intentar editar uno `aprobado` o `rechazado` devuelve 409.
        Solo Administración y Representantes.
      operationId: actualizarPresupuesto
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: presupuesto_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresupuestoActualizar'
      responses:
        '200':
          description: Presupuesto actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presupuesto'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El presupuesto no está en estado `presentado`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Presupuestos]
      summary: Eliminar un presupuesto presentado
      description: |
        Solo se permite eliminar presupuestos en estado `presentado`. Solo
        Administración y Representantes.
      operationId: eliminarPresupuesto
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: presupuesto_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Presupuesto eliminado exitosamente. Sin cuerpo de respuesta.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El presupuesto no está en estado `presentado`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trabajos/{trabajo_id}/presupuestos/{presupuesto_id}/archivo:
    get:
      tags: [Presupuestos]
      summary: Obtener la URL firmada del presupuesto
      description: |
        Devuelve una URL de vida corta para abrir el adjunto del presupuesto.
        Mismo criterio de rol que listar presupuestos: cualquier usuario
        autenticado del consorcio. El aislamiento entre consorcios lo da la
        validación del trabajo.
      operationId: urlDelPresupuesto
      parameters:
        - $ref: '#/components/parameters/xConsorcioIdHeader'
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer }
        - name: presupuesto_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: URL firmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivoUrlOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El trabajo o el presupuesto no existen, o el presupuesto no tiene adjunto.

  /archivos/{clave}:
    get:
      tags: [Archivos]
      summary: Descargar un archivo con URL firmada
      description: |
        **Endpoint público a propósito.** No exige `Authorization` porque lo
        consumen `<img src>` y `<a href>`, que no mandan headers. La
        autorización ya ocurrió cuando el usuario pidió la URL a un endpoint
        autenticado; acá sólo se verifica que la firma sea auténtica y no haya
        vencido.

        No construir esta URL a mano: se obtiene de los endpoints `.../archivo`.
      operationId: descargarArchivo
      security: []
      parameters:
        - name: clave
          in: path
          required: true
          description: Clave de almacenamiento del archivo (puede contener `/`).
          schema: { type: string }
        - name: exp
          in: query
          required: true
          description: Vencimiento de la firma, en epoch segundos.
          schema: { type: integer }
        - name: firma
          in: query
          required: true
          description: HMAC-SHA256 de `clave:exp`.
          schema: { type: string }
      responses:
        '200':
          description: El archivo.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Firma inválida o vencida.
        '404':
          description: El archivo no existe.

  /trabajos/{trabajo_id}/presupuestos/{presupuesto_id}/aprobar:
    post:
      tags: [Presupuestos]
      summary: Aprobar un presupuesto (mutex)
      description: |
        Marca el presupuesto como `aprobado` y lo enlaza al trabajo como
        `presupuesto_aprobado_id`. Si ya había otro presupuesto aprobado para
        el mismo trabajo, lo transiciona a `rechazado` automáticamente
        (mutex: un solo presupuesto aprobado por trabajo). Solo Administración
        y Representantes.
      operationId: aprobarPresupuesto
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: presupuesto_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Presupuesto aprobado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presupuesto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /trabajos/{trabajo_id}/presupuestos/{presupuesto_id}/rechazar:
    post:
      tags: [Presupuestos]
      summary: Rechazar un presupuesto
      description: |
        Marca el presupuesto como `rechazado`. Si era el aprobado del trabajo,
        desvincula el FK `presupuesto_aprobado_id`. Solo Administración y
        Representantes.
      operationId: rechazarPresupuesto
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: presupuesto_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Presupuesto rechazado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presupuesto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /trabajos/{trabajo_id}/completar:
    post:
      tags: [Tareas]
      summary: Devuelve payload pre-completado para crear el Gasto
      description: |
        NO crea el Gasto. Devuelve un objeto con los datos pre-cargados
        (proveedor, monto y concepto sugerido) que el frontend usa para abrir
        el formulario de `POST /gastos` con todo listo. El gasto se crea
        después con `trabajo_id` en el body, lo que dispara la finalización
        del trabajo. Solo Administración y Representantes.
      operationId: completarTrabajo
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Payload pre-completado devuelto exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletarTrabajoOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El trabajo no tiene un presupuesto aprobado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trabajos/{trabajo_id}/cancelar:
    post:
      tags: [Tareas]
      summary: Cancelar un trabajo
      description: |
        Marca el trabajo como `cancelado`. Solo Administración y Representantes.
      operationId: cancelarTrabajo
      parameters:
        - name: trabajo_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Trabajo cancelado exitosamente. Sin cuerpo de respuesta.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # ========================================================================
  # Plantillas de trabajos recurrentes (admin / representante)
  # ========================================================================

  /trabajos-recurrentes:
    get:
      tags: [TrabajosRecurrentes]
      summary: Listar plantillas de trabajos recurrentes
      operationId: listarTrabajosRecurrentes
      responses:
        '200':
          description: Lista de plantillas recurrentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrabajoRecurrenteOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [TrabajosRecurrentes]
      summary: Crear una plantilla de trabajo recurrente
      operationId: crearTrabajoRecurrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrabajoRecurrenteCrear'
      responses:
        '201':
          description: Plantilla creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrabajoRecurrenteOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /trabajos-recurrentes/{recurrente_id}:
    patch:
      tags: [TrabajosRecurrentes]
      summary: Editar una plantilla de trabajo recurrente
      operationId: actualizarTrabajoRecurrente
      parameters:
        - name: recurrente_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrabajoRecurrenteActualizar'
      responses:
        '200':
          description: Plantilla actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrabajoRecurrenteOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    delete:
      tags: [TrabajosRecurrentes]
      summary: Eliminar una plantilla de trabajo recurrente
      operationId: eliminarTrabajoRecurrente
      parameters:
        - name: recurrente_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Plantilla eliminada exitosamente. Sin cuerpo de respuesta.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /trabajos-recurrentes/{recurrente_id}/materializar:
    post:
      tags: [TrabajosRecurrentes]
      summary: Materializar la plantilla en un Trabajo concreto
      description: |
        Crea un Trabajo `en_curso` con descripción derivada de la plantilla
        (`"{nombre} — {descripcion}"`). La plantilla debe estar activa.
      operationId: materializarTrabajoRecurrente
      parameters:
        - name: recurrente_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '201':
          description: Trabajo creado a partir de la plantilla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '400':
          description: La plantilla está inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # ========================================================================
  # Notificaciones in-app (campanita) — filtradas por usuario del JWT
  # ========================================================================

  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar notificaciones del usuario actual
      description: |
        Devuelve las notificaciones del usuario autenticado, ordenadas por
        `created_at` descendente. Cada usuario solo ve sus propias notificaciones.
      operationId: listarNotificaciones
      parameters:
        - name: solo_no_leidas
          in: query
          required: false
          description: Si es true, devuelve solo las notificaciones sin leer.
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          required: false
          description: Filtra por texto contenido en el mensaje (sin distinguir mayúsculas).
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Cantidad de notificaciones a saltear (paginación). Default 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Máximo de notificaciones a devolver. Default 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Lista de notificaciones del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacionOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /notificaciones/no-leidas-count:
    get:
      tags: [Notificaciones]
      summary: Contar notificaciones no leídas del usuario actual
      description: |
        Usado por el componente campanita para mostrar el badge. El frontend
        consulta este endpoint en polling (cada 60 s).
      operationId: contarNotificacionesNoLeidas
      responses:
        '200':
          description: Conteo de no leídas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionesCountOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /notificaciones/marcar-todas-leidas:
    post:
      tags: [Notificaciones]
      summary: Marcar todas las notificaciones como leídas
      operationId: marcarTodasNotificacionesLeidas
      responses:
        '204':
          description: Todas las notificaciones del usuario marcadas como leídas.
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /notificaciones/preferencias:
    get:
      tags: [Notificaciones]
      summary: Listar preferencias de aviso del usuario actual
      description: |
        Devuelve, para cada evento del catálogo que aplica al rol del usuario
        autenticado, si le llega por correo además de por campanita. La
        campanita nunca se puede apagar: sólo existe el interruptor de mail.
      operationId: listarPreferenciasNotificacion
      responses:
        '200':
          description: Preferencias de aviso del usuario, una por evento de su rol.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenciaNotificacionOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    put:
      tags: [Notificaciones]
      summary: Guardar preferencias de aviso del usuario actual
      description: |
        Sólo acepta eventos del rol del usuario y marcados como `editable`;
        un tipo desconocido, ajeno al rol, o no editable devuelve 400.
      operationId: guardarPreferenciasNotificacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreferenciaNotificacionIn'
      responses:
        '204':
          description: Preferencias guardadas.
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /notificaciones/{notificacion_id}/marcar-leida:
    post:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      description: |
        Solo el dueño de la notificación puede marcarla; intentar marcar una
        de otro usuario devuelve 404 (anti-enumeración).
      operationId: marcarNotificacionLeida
      parameters:
        - name: notificacion_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Notificación marcada como leída.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # =========================================================================
  # 3. COMUNICACIÓN
  # =========================================================================

  /comunicados:
    get:
      tags: [Comunicación]
      summary: Listar comunicados
      description: Devuelve los comunicados publicados. Accesible para todos los roles autenticados.
      operationId: listarComunicados
      responses:
        '200':
          description: Lista de comunicados recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comunicado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Comunicación]
      summary: Publicar un comunicado
      description: Crea un nuevo comunicado del consorcio. Solo accesible para Administración.
      operationId: crearComunicado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComunicadoCrear'
      responses:
        '201':
          description: Comunicado publicado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunicado'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /comunicados/{comunicado_id}:
    delete:
      tags: [Comunicación]
      summary: Borrar un comunicado (soft-delete)
      description: |
        Marca el comunicado como eliminado. Operación irreversible desde la UI.
        Solo accesible para Administración. Los comunicados eliminados dejan de
        aparecer en `GET /comunicados`.
      operationId: borrarComunicado
      parameters:
        - name: comunicado_id
          in: path
          required: true
          description: Identificador único del comunicado.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Comunicado eliminado exitosamente.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # =========================================================================
  # 4. AMENITIES (RESERVA DE ESPACIOS)
  # =========================================================================

  /amenities:
    get:
      tags: [Amenities]
      summary: Listar amenities
      description: |
        Devuelve los amenities disponibles en el consorcio (SUM, Laundry, etc.).
        Accesible para todos los roles autenticados.
      operationId: listarAmenities
      parameters:
        - name: incluir_inactivos
          in: query
          required: false
          description: Si true y el caller es admin, devuelve también inactivos. Para no-admin se ignora.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Lista de amenities recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Amenity'
        '401':
          $ref: '#/components/responses/NoAutenticado'

    post:
      tags: [Administracion]
      summary: Crear un amenity (espacio común)
      description: |
        Crea un nuevo amenity. Solo accesible para Administración. El `nombre`
        es único en el consorcio — si ya existe se devuelve 409.
      operationId: crearAmenity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenityCrear'
      responses:
        '201':
          description: Amenity creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          description: Ya existe un amenity con ese nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /amenities/{amenity_id}:
    patch:
      tags: [Administracion]
      summary: Editar un amenity
      description: |
        Permite a Administración modificar `nombre` y/o `descripcion` de un
        amenity. Solo se actualizan los campos enviados (PATCH parcial). El
        nuevo `nombre` debe seguir siendo único (409 si colisiona con otro).
      operationId: actualizarAmenity
      parameters:
        - name: amenity_id
          in: path
          required: true
          description: Identificador único del amenity.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenityActualizar'
      responses:
        '200':
          description: Amenity actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya existe otro amenity con ese nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Amenities]
      summary: Dar de baja un amenity (soft-delete)
      operationId: darDeBajaAmenity
      parameters:
        - name: amenity_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Amenity dado de baja exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amenity'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El amenity ya estaba inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /amenities/{amenity_id}/disponibilidad:
    get:
      tags: [Amenities]
      summary: Consultar disponibilidad de un amenity
      description: |
        Devuelve los bloques horarios disponibles y reservados para un amenity
        (SUM, Laundry, etc.) en un rango de fechas. Accesible para todos los roles.
      operationId: consultarDisponibilidad
      parameters:
        - name: amenity_id
          in: path
          required: true
          description: Identificador único del amenity.
          schema:
            type: integer
            format: int64
        - name: desde
          in: query
          required: true
          description: Fecha inicial del rango a consultar (ISO 8601).
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          description: Fecha final del rango a consultar (ISO 8601).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Disponibilidad recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /amenities/{amenity_id}/reservas:
    post:
      tags: [Amenities]
      summary: Reservar un amenity
      description: |
        Crea una nueva reserva para el amenity indicado. Accesible para todos
        los roles autenticados. El `usuario_id` se asigna server-side desde el
        token JWT; cualquier valor en el body es ignorado. `inicio` debe ser
        estrictamente anterior a `fin` (400 si no). Si el rango solicitado se
        superpone con una reserva confirmada existente para el mismo amenity,
        se devuelve 409 Conflict.
      operationId: crearReserva
      parameters:
        - name: amenity_id
          in: path
          required: true
          description: Identificador único del amenity.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCrear'
      responses:
        '201':
          description: Reserva creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El horario solicitado se superpone con una reserva existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservas:
    get:
      tags: [Amenities]
      summary: Listar mis reservas
      description: |
        Devuelve las reservas asociadas al usuario autenticado. Administración y
        Representantes ven todas las reservas. Los Departamentos ven solo las
        reservas que ellos mismos crearon. La identidad se obtiene del token.
      operationId: listarReservas
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado de la reserva.
          schema:
            type: string
            enum: [confirmada, cancelada]
      responses:
        '200':
          description: Lista de reservas recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  # =========================================================================
  # 5. ADMINISTRACIÓN (ALTAS Y EDICIÓN)
  # =========================================================================

  /departamentos:
    get:
      tags: [Administracion]
      summary: Listar departamentos
      description: |
        Devuelve los departamentos (unidades funcionales) del consorcio. Solo
        accesible para Administración.
      operationId: listarDepartamentos
      responses:
        '200':
          description: Lista de departamentos recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departamento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Administracion]
      summary: Crear un departamento (unidad funcional)
      description: |
        Crea un nuevo departamento. Solo accesible para Administración. El
        `codigo` (ej. UF-1A) es único en el consorcio — si ya existe se
        devuelve 409.
      operationId: crearDepartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoCrear'
      responses:
        '201':
          description: Departamento creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          description: Ya existe un departamento con ese código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /coeficientes:
    put:
      tags: [Administracion]
      summary: Reemplazar toda la matriz de coeficientes del consorcio
      description: |
        Reemplazo atómico: borra todos los coeficientes del consorcio activo
        y guarda los enviados en el body. Valida que todos los `departamento_id`
        y `clase_prorrateo_id` pertenezcan al consorcio activo. No valida que
        las sumas por clase den 100 — eso lo maneja el frontend porque el
        reglamento de copropiedad manda.
      operationId: reemplazarCoeficientesMatriz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoeficientesBulkIn'
      responses:
        '200':
          description: Matriz reemplazada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cantidad: { type: integer }
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: Algún departamento o clase referenciado no existe en el consorcio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /padron/importar:
    post:
      tags: [Administracion]
      summary: Alta masiva unificada de departamentos y usuarios
      description: |
        CSV multipart con columnas `codigo`, `ubicacion`, `email`. Cada fila:
        crea el depto (o lo reutiliza si el código ya existe) y opcionalmente
        crea un usuario con password aleatoria + `must_change_password=true`.
        Si `email` viene vacío se crea solo el depto.
      operationId: importarPadron
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resumen del batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PadronImportarResultado'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /departamentos/{departamento_id}:
    patch:
      tags: [Administracion]
      summary: Editar un departamento
      description: |
        Permite a Administración modificar la `descripcion` de un departamento.
        El `codigo` es inmutable post-creación porque identifica a la unidad en
        documentos externos.
      operationId: actualizarDepartamento
      parameters:
        - name: departamento_id
          in: path
          required: true
          description: Identificador único del departamento.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoActualizar'
      responses:
        '200':
          description: Departamento actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    delete:
      tags: [Administracion]
      summary: Eliminar un departamento
      description: |
        Hard delete. Falla con 409 `departamento_con_actividad` si tiene
        usuarios, expensas, peticiones, comprobantes, movimientos de cuenta
        o gastos asignados. Los coeficientes de prorrateo se borran en cascada.
      operationId: eliminarDepartamento
      parameters:
        - name: departamento_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Departamento eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Departamento con actividad vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios:
    get:
      tags: [Administracion]
      summary: Listar usuarios
      description: |
        Devuelve los usuarios registrados en el sistema. Solo accesible para
        Administración. No incluye hashes de contraseñas.
      operationId: listarUsuarios
      responses:
        '200':
          description: Lista de usuarios recuperada exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioOut'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

    post:
      tags: [Administracion]
      summary: Crear un usuario
      description: |
        Crea un nuevo usuario. Solo accesible para Administración. La
        contraseña se hashea server-side y nunca se devuelve. Los usuarios con
        rol `departamento` requieren `departamento_id`; los demás roles no
        deben llevarlo.
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          description: El departamento indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe un usuario con ese email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios/{usuario_id}:
    patch:
      tags: [Administracion]
      summary: Editar un usuario
      description: |
        Permite a Administración modificar `email`, `rol` y/o `departamento_id`
        de un usuario. La contraseña NO se modifica acá — el propio usuario la
        cambia vía `POST /auth/cambiar-password`. Solo se actualizan los
        campos enviados (PATCH parcial). Tras aplicar los cambios, el estado
        final debe respetar la invariante rol↔departamento_id: si el resultado
        es inconsistente se devuelve 400.
      operationId: actualizarUsuario
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador único del usuario.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Usuario actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOut'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya existe otro usuario con ese email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Administracion]
      summary: Eliminar un usuario
      description: |
        Hard delete. Falla con 409 `usuario_con_actividad` si el usuario tiene
        reservas, comunicados como autor o cierres de período vinculados. En
        ese caso conviene suspender vía `/estado`.
      operationId: eliminarUsuario
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Usuario eliminado.
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Usuario con actividad vinculada. Suspenderlo en lugar de eliminar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

