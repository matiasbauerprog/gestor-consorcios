    GastoOut:
      type: object
      required: [id, periodo, rubro, proveedor_id, concepto, monto, forma_pago, fecha_pago]
      properties:
        id: { type: integer }
        periodo: { type: string }
        rubro: { type: string }
        clase_prorrateo_id: { type: integer, nullable: true }
        departamento_id: { type: integer, nullable: true }
        proveedor_id: { type: integer }
        concepto: { type: string }
        monto: { type: number }
        forma_pago:
          type: string
          enum: [transferencia, debito_automatico, cheque, efectivo, otro]
        fecha_pago: { type: string, format: date }
        pagado:
          type: boolean
          description: >-
            `false` mientras el gasto está devengado pero sin pagar: se prorratea
            a los departamentos, no descuenta de la caja (no tiene MovimientoCaja)
            y cuenta como pasivo en el estado financiero. Pasa a `true` con
            `POST /gastos/{gasto_id}/pagar`, que es lo que genera el egreso.
