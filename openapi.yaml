  # =========================================================================
  # GASTOS
  # =========================================================================

  /gastos:
    get:
      tags: [Gastos]
      summary: Listar gastos del consorcio (materializa recurrentes pendientes) (admin)
      description: >-
        Antes de listar, materializa (idempotente) los gastos de las plantillas
        recurrentes activas que falten para el período consultado — sólo si el
        período es actual/pasado y no está cerrado. Es un efecto de escritura
        deliberado en un GET: la alternativa es un scheduler que el proyecto no
        tiene, y repetir la consulta no duplica nada.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: periodo
          required: false
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - in: query
          name: rubro
          required: false
          schema: { type: string }
        - in: query
          name: clase_prorrateo_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: departamento_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: proveedor_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: gasto_habitual_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GastoOut' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
    post:
      tags: [Gastos]
      summary: Crear un gasto (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GastoCrear' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoOut' }
        '400': { $ref: '#/components/responses/PedidoInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /gastos/plan-cuotas:
    post:
      tags: [Gastos]
      summary: Crear plan de N cuotas (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCuotasCrear' }
      responses:
        '201':
          description: N gastos creados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GastoOut' }
        '400': { $ref: '#/components/responses/PedidoInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /gastos/cargar-habituales:
    post:
      tags: [Gastos]
      summary: Materializar plantillas habituales activas en un período (admin)
      description: >-
        Crea los gastos que faltan para las plantillas activas del período.
        Idempotente: una plantilla que ya generó su gasto en ese período se
        saltea. Los gastos nacen SIN pagar (`pagado: false`) y **no** generan
        MovimientoCaja — la plantilla dice cuánto se espera gastar, no cuánto
        se gastó. El egreso de caja lo produce `POST /gastos/{gasto_id}/pagar`
        cuando llega la factura real. Mientras tanto el gasto se prorratea a
        los departamentos y figura como pasivo en el estado financiero.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CargarHabitualesIn' }
      responses:
        '201':
          description: Lista de gastos generados (puede ser vacía si todos ya estaban).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GastoOut' }
        '400': { $ref: '#/components/responses/PedidoInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }

  /gastos/{gasto_id}:
    parameters:
      - in: path
        name: gasto_id
        required: true
        schema: { type: integer }
    get:
      tags: [Gastos]
      summary: Obtener gasto
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoOut' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Gastos]
      summary: Editar gasto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GastoActualizar' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoOut' }
        '400': { $ref: '#/components/responses/PedidoInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Gastos]
      summary: Eliminar gasto
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /gastos/{gasto_id}/pagar:
    parameters:
      - in: path
        name: gasto_id
        required: true
        schema: { type: integer }
    post:
      tags: [Gastos]
      summary: Confirmar el pago de un gasto devengado (admin)
      description: >-
        Confirma el pago real de un gasto materializado sin pagar (recurrente
        o de cualquier origen): fija monto, fecha de pago y caja definitivos
        con los datos de la factura, y recién ahí genera el MovimientoCaja de
        egreso. El monto puede diferir del de la plantilla — la factura manda.


        Si el período del gasto ya está CERRADO, se admite confirmar el pago
        únicamente por el mismo `monto` que el gasto ya tiene: eso no altera lo
        prorrateado a los departamentos. Un monto distinto devuelve 409, porque
        el cierre sólo advierte sobre los gastos impagos y la diferencia hay que
        registrarla como un gasto aparte en un período abierto.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GastoPagar' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoOut' }
        '400': { $ref: '#/components/responses/PedidoInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/AccesoDenegado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            El gasto ya figura como pagado, o el período está cerrado y el
            `monto` enviado difiere del que tiene el gasto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gastos-habituales:
    get:
      tags: [Gastos]
      summary: Listar plantillas (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: activa
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
